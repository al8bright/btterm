<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>개인키 추가</title>
</head>
<body><p style="margin:0;padding:8px 16px;background:#13161B;font:12px system-ui;color:#9AA3AE"><a href="index.html" style="color:#7DB5FF">← 목업 목록</a></p>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D10}
a{color:#7DB5FF}a:hover{color:#A9CEFF}
</style>
<div style="width: 720px; height: 820px; box-sizing: border-box; padding: 32px; display: flex; align-items: flex-start; justify-content: center; background: #0B0D10; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; color: #E6E8EB; font-size: 13px">
<form role="dialog" aria-labelledby="ka-title" style="width: 640px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; padding: 24px; background: #161A20; border: 1px solid #262B33; border-radius: 12px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7DB5FF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="15" r="4"></circle><path d="M10.8 12.2L20 3M16 7l3 3M14 9l2 2"></path></svg>
<h2 id="ka-title" style="margin: 0; font-size: 17px; font-weight: 600">개인키 추가</h2>
<button type="button" style="margin-left: auto; height: 32px; padding: 0 12px; background: transparent; border: 1px solid #2E343D; border-radius: 6px; color: #C9CED6; font: inherit; font-size: 12px; cursor: pointer">새 키 쌍 생성</button>
</div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #9AA3AE">이름</span>
<input type="text" value="ubuntu-key" style="height: 36px; padding: 0 10px; background: #0F1115; border: 1px solid #2E343D; border-radius: 6px; color: #E6E8EB; font: inherit">
</label>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 12px; color: #9AA3AE">저장 방식</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; background: #1B2A40; border: 2px solid #4C9BFF; border-radius: 8px; cursor: pointer">
<span style="display: flex; align-items: center; gap: 8px; font-weight: 600"><input type="radio" name="src" checked="" style="margin: 0; accent-color: #4C9BFF">파일 경로 참조</span>
<span style="font-size: 12px; line-height: 1.5; color: #B9C8DC">키 파일은 그대로 두고 경로만 기억합니다. 기존 ~/.ssh 키를 계속 쓸 때.</span>
</label>
<label style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; background: #0F1115; border: 1px solid #2E343D; border-radius: 8px; cursor: pointer">
<span style="display: flex; align-items: center; gap: 8px; font-weight: 600"><input type="radio" name="src" style="margin: 0; accent-color: #4C9BFF">가져오기 (암호화 저장)</span>
<span style="font-size: 12px; line-height: 1.5; color: #9AA3AE">키 내용을 btterm 보관소에 암호화해 저장합니다. 파일 선택 또는 붙여넣기.</span>
</label>
</div>
</fieldset>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #9AA3AE">키 파일</span>
<span style="display: flex; gap: 8px">
<input type="text" value="C:\Users\me\.ssh\id_ed25519" style="flex: 1; min-width: 0; height: 36px; padding: 0 10px; background: #0F1115; border: 1px solid #2E343D; border-radius: 6px; color: #E6E8EB; font-family: 'JetBrains Mono', monospace; font-size: 12px">
<button type="button" style="height: 36px; padding: 0 12px; background: transparent; border: 1px solid #2E343D; border-radius: 6px; color: #C9CED6; font: inherit; font-size: 12px; cursor: pointer">찾아보기</button>
</span>
</label>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #0F1115; border: 1px solid #23402F; border-radius: 8px">
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3FBF7F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
<span style="font-weight: 500">유효한 OpenSSH 키</span>
<span style="font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #1E232B; color: #C9CED6">ED25519</span>
<span style="font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #1E232B; color: #C9CED6">암호 보호됨</span>
</div>
<div style="display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 4px 10px; font-size: 12px">
<span style="color: #9AA3AE">지문</span>
<span style="font-family: 'JetBrains Mono', monospace; color: #C9CED6; word-break: break-all">SHA256:mR4tY8wQ2nB6vC1xZ9kL3pJ7hF5gD0sA2eU4iO6yT8w</span>
<span style="color: #9AA3AE">공개키</span>
<span style="display: flex; align-items: flex-start; gap: 8px; min-width: 0">
<span style="flex: 1; min-width: 0; font-family: 'JetBrains Mono', monospace; color: #C9CED6; word-break: break-all">ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK7v…q9Xw ubuntu-key</span>
<button type="button" style="flex-shrink: 0; height: 28px; padding: 0 10px; background: transparent; border: 1px solid #2E343D; border-radius: 6px; color: #C9CED6; font: inherit; font-size: 12px; cursor: pointer">복사</button>
</span>
</div>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 12px; color: #9AA3AE">키 암호(passphrase)</legend>
<label style="display: flex; align-items: center; gap: 8px; cursor: pointer"><input type="radio" name="pp" style="margin: 0; accent-color: #4C9BFF">접속할 때마다 입력</label>
<label style="display: flex; align-items: center; gap: 8px; cursor: pointer"><input type="radio" name="pp" checked="" style="margin: 0; accent-color: #4C9BFF">앱 실행 동안 기억 <span style="font-size: 12px; color: #9AA3AE">(메모리에만, 재시작 시 다시 입력)</span></label>
<label style="display: flex; align-items: center; gap: 8px; cursor: pointer"><input type="radio" name="pp" style="margin: 0; accent-color: #4C9BFF">보관소에 암호화해 저장</label>
</fieldset>

<div style="display: flex; gap: 8px; padding: 10px 12px; background: #12161C; border-radius: 8px; font-size: 12px; line-height: 1.6; color: #9AA3AE">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
<span>경로 참조 방식에서는 원본 키 파일의 보호를 Windows 계정 권한에 맡깁니다. 파일이 사라지거나 바뀌면 접속 전에 알려 드립니다.</span>
</div>

<div style="display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid #262B33">
<span style="flex: 1"></span>
<button type="button" style="height: 40px; padding: 0 14px; background: transparent; border: 0; border-radius: 8px; color: #9AA3AE; font: inherit; cursor: pointer">취소</button>
<button type="submit" style="height: 40px; padding: 0 18px; background: #4C9BFF; border: 0; border-radius: 8px; color: #0B0D10; font: inherit; font-weight: 600; cursor: pointer">키 추가</button>
</div>
</form>
</div>
</body>
</html>
