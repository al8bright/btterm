# 통합 테스트용 sshd. 실제 서버·사용자 ~/.ssh에는 접속하지 않는다(AGENTS.md §6).
# 서비스는 해당 AC를 작업할 때 추가한다(PLAN 0-A). toxiproxy는 단절 테스트용.
name: btterm-test
services:
  target:
    build:
      context: .
      dockerfile: target.Dockerfile
    image: btterm-test-target:local
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: Asia/Seoul
      USER_NAME: btterm
      USER_PASSWORD: btterm-pw
      PASSWORD_ACCESS: 'true'
      LANG: C.UTF-8
    ports:
      - '127.0.0.1:2222:2222'
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 2222 || exit 1']
      interval: 2s
      timeout: 2s
      retries: 30
  # 네트워크 단절 재현(AC12): 127.0.0.1:2223 → target:2222. 프록시·장애는 테스트가 API(8474)로 만든다.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    ports:
      - '127.0.0.1:8474:8474'
      - '127.0.0.1:2223:2223'
    depends_on:
      target:
        condition: service_healthy
